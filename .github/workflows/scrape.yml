name: Scrape Bursa Comps Data

on:
  schedule:
    # Runs every day at 22:00 UTC (06:00 Malaysia time) - deliberately NOT
    # tied to the digest Routine's own schedule. This means the digest can
    # be moved to any day/time (weekly, daily, whatever) without ever
    # needing a matching change here: fresh data (at most ~24h old, usually
    # much less since KLSE only moves on trading days) is always waiting.
    # Changed from a Monday-only, "1hr ahead" schedule on 2026-08-27 so the
    # two schedules never need to be kept in sync by hand again.
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scrape
        continue-on-error: true
        run: python scrape.py

      - name: Commit and push data
        if: always()
        run: |
          git config user.name "bursa-comps-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update scraped data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Fail job if scrape failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1
